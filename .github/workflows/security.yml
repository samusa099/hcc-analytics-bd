name: Security Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: hcc-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            python_sqlite/requirements.txt

      - name: Install security tools
        run: python -m pip install --disable-pip-version-check bandit==1.9.4 pip-audit==2.10.1

      - name: Compile Python sources
        run: |
          python -m compileall -q python_sqlite
          if [ -d scripts ]; then python -m compileall -q scripts; fi

      - name: Run Bandit static analysis
        run: |
          bandit -q -r python_sqlite -x python_sqlite/.ipynb_checkpoints,python_sqlite/cleaned
          if [ -d scripts ]; then bandit -q -r scripts; fi

      - name: Audit build dependencies
        run: pip-audit --requirement requirements-build.txt

      - name: Audit analytics dependencies
        run: pip-audit --requirement python_sqlite/requirements.txt
