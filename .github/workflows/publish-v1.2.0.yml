name: Publish HCC Analytics BD v1.2.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v1.2.0.yml"

permissions:
  contents: write

jobs:
  publish-release:
    if: github.repository == 'samusa099/hcc-analytics-bd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create v1.2.0 tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.2.0 already exists."
            exit 0
          fi

          cat > release-notes.md <<'EOF'
          ## 🔐 Security & Power BI Upload Readiness

          This release hardens the repository and introduces the approved Power BI upload process.

          ### Power BI
          - Added `powerbi/README.md` with the recommended `HCC_Analytics_BD.pbix` location.
          - Added credential, connection, Power Query, custom visual, gateway and RLS review steps.
          - Documented Git LFS or GitHub Release assets for large PBIX binaries.
          - The CSV model, data dictionary and DAX guidance remain ready for Power BI development.
          - A native PBIX binary must be reviewed manually before upload; it is not generated by this repository.

          ### Security
          - Routine workflows now use read-only repository permission.
          - Removed automatic CI commits and pushes to `main`.
          - Pinned official GitHub Actions to immutable commit SHAs.
          - Added Bandit, `pip-audit`, Dependabot, CODEOWNERS and `SECURITY.md`.
          - Pinned build and analytics dependencies.
          - Neutralised spreadsheet-formula prefixes in cleaned CSV exports.
          - Added configured table allow-list and path validation.

          ### Review result
          The workflow-token and spreadsheet-formula risks identified during review were remediated. No confirmed exploitable remote-code-execution, exposed credential, remotely controlled SQL-injection or authentication vulnerability was found in the reviewed Python paths.

          See `RELEASE_NOTES.md` and `docs/SECURITY_REVIEW_2026-07-24.md` for the complete record.
          EOF

          gh release create v1.2.0 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "HCC Analytics BD v1.2.0" \
            --notes-file release-notes.md \
            --latest
