name: Portfolio Security

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Repository and data-file policy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, re, sys, zipfile

          root = Path('.').resolve()
          errors = []
          blocked = {'.env', 'id_rsa', 'id_dsa', 'credentials.json', 'service-account.json'}
          binary = {'.exe', '.dll', '.scr', '.com', '.msi', '.jar', '.apk', '.dmg', '.iso'}

          for p in Path('.').rglob('*'):
            if '.git' in p.parts or not p.is_file():
              continue
            try:
              p.resolve().relative_to(root)
            except ValueError:
              errors.append(f'Path escapes repository: {p}')
            if p.name.lower() in blocked or p.suffix.lower() in binary:
              errors.append(f'Blocked file: {p}')
            if p.is_symlink():
              try:
                p.resolve(strict=True).relative_to(root)
              except Exception:
                errors.append(f'Unsafe symlink: {p}')

          for p in Path('.').rglob('*.xlsx'):
            try:
              with zipfile.ZipFile(p) as z:
                names = z.namelist()
                if '[Content_Types].xml' not in names or 'xl/workbook.xml' not in names:
                  errors.append(f'Invalid XLSX: {p}')
                for n in names:
                  if n.startswith(('/', '\\')) or '..' in Path(n).parts:
                    errors.append(f'XLSX path traversal: {p}:{n}')
                  if z.getinfo(n).file_size > 200_000_000:
                    errors.append(f'Oversized XLSX member: {p}:{n}')
            except Exception as e:
              errors.append(f'Unreadable XLSX {p}: {e}')

          for p in Path('.').rglob('*.ipynb'):
            try:
              nb = json.loads(p.read_text(encoding='utf-8'))
            except Exception as e:
              errors.append(f'Invalid notebook {p}: {e}')
              continue
            for i, cell in enumerate(nb.get('cells', [])):
              if cell.get('cell_type') != 'code':
                continue
              src = ''.join(cell.get('source', [])).lower()
              if any(x in src for x in ('curl | sh', 'wget | sh', 'rm -rf /', 'subprocess.popen', 'os.system(')):
                errors.append(f'Unsafe notebook command: {p} cell {i}')

          for p in Path('.').rglob('*.csv'):
            try:
              with p.open(encoding='utf-8-sig', newline='', errors='replace') as f:
                for row_number, row in enumerate(csv.reader(f), 1):
                  for column_number, value in enumerate(row, 1):
                    if value.lstrip().startswith(('=', '+', '@', '\t', '\r')):
                      errors.append(f'CSV formula injection risk: {p}:{row_number}:{column_number}')
            except OSError as e:
              errors.append(f'Unreadable CSV {p}: {e}')

          action_ref = re.compile(r'^\s*uses:\s*[^\s@]+@([^\s#]+)', re.M)
          codeql_ref = re.compile(
            r'^\s*uses:\s*github/codeql-action/(init|analyze)@([0-9a-fA-F]{40})',
            re.M,
          )

          for workflow in Path('.github/workflows').glob('*.y*ml'):
            text = workflow.read_text(encoding='utf-8')
            for ref in action_ref.findall(text):
              if not re.fullmatch(r'[0-9a-fA-F]{40}', ref):
                errors.append(f'Non-immutable action reference in {workflow}: @{ref}')

            codeql = dict(codeql_ref.findall(text))
            if 'init' in codeql and 'analyze' in codeql and codeql['init'] != codeql['analyze']:
              errors.append(
                f'{workflow}: CodeQL init/analyze SHA mismatch: '
                f"{codeql['init']} != {codeql['analyze']}"
              )

          if errors:
            print('\n'.join(f'::error::{error}' for error in errors))
            sys.exit(1)
          PY

      - name: Gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -fsSLo /tmp/gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - name: Dependency audit
        run: |
          set -euo pipefail
          if find . -name 'requirements*.txt' -not -path './.git/*' | grep -q .; then
            python3 -m pip install --disable-pip-version-check pip-audit==2.9.0
            while IFS= read -r f; do
              python3 -m pip_audit -r "$f"
            done < <(find . -name 'requirements*.txt' -not -path './.git/*')
          fi
          [ ! -f package-lock.json ] || npm audit --audit-level=high

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          languages: python
          queries: security-extended
      - uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
