name: Validate HCC Analytics BD Assets

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: hcc-assets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Validate committed project assets
        run: |
          test -f excel/Bangladesh_HR_Compensation_Compliance_Dashboards.xlsx
          test -f data/employees.csv
          test -f data/payroll_monthly.csv
          test -f data/compliance_register.csv
          test -f data/data_dictionary.csv
          test -f python_sqlite/hr_analytics.sqlite
          test -f python_sqlite/hr_pipeline.py
          test -f guide/How_to_Use_Bangladesh_HR_Analytics_Pack.png
          test -f powerbi/README.md
          python - <<'PY'
          import csv
          import json
          import sqlite3
          from pathlib import Path

          with open('data/employees.csv', encoding='utf-8-sig') as file:
              assert sum(1 for _ in csv.DictReader(file)) == 120
          with sqlite3.connect('python_sqlite/hr_analytics.sqlite') as connection:
              assert connection.execute('select count(*) from employees').fetchone()[0] == 120
          notebook = Path('python_sqlite/HR_Data_Cleaning_SQLite_Analytics.ipynb')
          if notebook.exists():
              json.loads(notebook.read_text(encoding='utf-8'))
          assert Path('excel/Bangladesh_HR_Compensation_Compliance_Dashboards.xlsx').stat().st_size > 10000
          print('Committed analytics assets validated.')
          PY

      - name: Compile Python sources
        run: python -m compileall -q python_sqlite
